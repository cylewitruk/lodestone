name: Release-plz

# On every push to main: keep a release PR open with the next version and changelog. When that
# PR is merged: publish to crates.io, push the `v*` tag, and dispatch release.yml (dist) for it.
# Tags pushed with GITHUB_TOKEN start no workflows, but a workflow_dispatch from it does.

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release:
    name: Release
    if: github.repository_owner == 'cylewitruk'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # crates.io trusted publishing
      actions: write # dispatch release.yml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
          build-warnings: warn
      - id: release
        uses: release-plz/action@v0.5
        with:
          command: release
          version: 0.4.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build binaries and the GitHub Release
        if: steps.release.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ fromJSON(steps.release.outputs.releases)[0].tag }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f tag="$TAG"

  release-pr:
    name: Release PR
    if: github.repository_owner == 'cylewitruk'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
          build-warnings: warn
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
          version: 0.4.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
