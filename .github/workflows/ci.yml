name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_CONFIG: --config .github/cargo-ci.toml
  # Pull requests restore the caches `main` saves.
  CACHE_SAVE: ${{ github.ref == 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: warn
          cache-save-if: ${{ env.CACHE_SAVE }}
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked $CARGO_CONFIG -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: warn
          cache-save-if: ${{ env.CACHE_SAVE }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --locked --no-fail-fast $CARGO_CONFIG

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      # `cargo publish` runs the verify build.
      - run: cargo package --locked --no-verify
