[package]
name = "lodestone-cli"
version = "0.1.4"
edition = "2024"
description = "Local semantic code search daemon for coding agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cylewitruk/lodestone"
readme = "README.md"
keywords = ["code-search", "semantic-search", "mcp", "embeddings", "tree-sitter"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/eval", "/examples", "/.github", "/assets", "/docs", "/dist-workspace.toml", "/release-plz.toml"]

[lib]
name = "lodestone"
path = "src/lib.rs"

[[bin]]
name = "lode"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.3"
axum = "0.8.9"
blake3 = "1.8.7"
candle-core = { version = "0.11.1", optional = true }
candle-nn = { version = "0.11.1", optional = true }
candle-transformers = { version = "0.11.1", optional = true }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
fastembed = { version = "7.6.1", optional = true }
globset = "0.4.21"
hf-hub = { version = "0.5.0", optional = true, default-features = false, features = ["ureq", "native-tls"] }
ignore = "0.4.34"
notify = "8.2.1"
notify-debouncer-full = "0.7.0"
rayon = "1.12.0"
regex = "1.13.1"
rmcp = { version = "3.9.0", features = ["transport-streamable-http-server", "transport-io"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tantivy = "0.27.0"
thiserror = "2.0.21"
# Without `esaxx_fast` (training only): its C++ build uses the static CRT and fails to link on Windows.
tokenizers = { version = "0.23.2", optional = true, default-features = false, features = ["onig"] }
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
toml_edit = { version = "0.25.19", default-features = false, features = ["parse", "display"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tree-sitter = "0.27.2"
tree-sitter-c = { version = "0.24.2", optional = true }
tree-sitter-c-sharp = { version = "0.23.5", optional = true }
tree-sitter-cpp = { version = "0.23.4", optional = true }
tree-sitter-elixir = { version = "0.3.5", optional = true }
tree-sitter-go = { version = "0.25.0", optional = true }
tree-sitter-java = { version = "0.23.5", optional = true }
tree-sitter-language = { version = "0.1.9", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-loader = "0.27.2"
tree-sitter-lua = { version = "0.5.0", optional = true }
tree-sitter-md = { version = "0.5.4", optional = true }
tree-sitter-php = { version = "0.25.1", optional = true }
tree-sitter-python = { version = "0.25.0", optional = true }
tree-sitter-ruby = { version = "0.23.1", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-swift = { version = "0.7.4", optional = true }
tree-sitter-tags = "0.27.2"
tree-sitter-typescript = { version = "0.23.2", optional = true }
ureq = { version = "3.5.1", features = ["json"] }
url = "2.5.8"
# SIMD distance kernels (numkong) are enabled per target below.
usearch = { version = "2.26.6", default-features = false }
tree-sitter-svelte-ng = { version = "1.0.2", optional = true }
axoupdater = { version = "0.10.3", features = ["blocking"] }
semver = "1.0.28"


[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11.1", optional = true, features = ["metal"] }
candle-nn = { version = "0.11.1", optional = true, features = ["metal"] }
candle-transformers = { version = "0.11.1", optional = true, features = ["metal"] }
# Same prerelease fastembed resolves to; only adds the CoreML execution provider.
ort = { version = "=2.0.0-rc.15", optional = true, default-features = false, features = ["coreml"] }

# numkong doesn't compile with the GCC/binutils of Ubuntu 22.04 on arm64; usearch falls back to
# auto-vectorized distance loops there.
[target.'cfg(not(all(target_os = "linux", target_arch = "aarch64")))'.dependencies]
usearch = { version = "2.26.6", features = ["numkong"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

[build-dependencies]
cc = "1.2"

[features]
default = ["lang-rust", "lang-python", "lang-typescript", "lang-svelte", "lang-go", "lang-java", "lang-c", "lang-cpp", "lang-csharp", "lang-ruby", "lang-php", "lang-lua", "lang-elixir", "lang-swift", "lang-markdown", "lang-clarity", "candle"]
lang-rust = ["dep:tree-sitter-rust"]
lang-python = ["dep:tree-sitter-python"]
lang-typescript = ["dep:tree-sitter-typescript", "dep:tree-sitter-javascript"]
# Svelte components: their `<script>` blocks are tagged as TypeScript or JavaScript.
lang-svelte = ["lang-typescript", "dep:tree-sitter-svelte-ng"]
lang-go = ["dep:tree-sitter-go"]
lang-java = ["dep:tree-sitter-java"]
lang-c = ["dep:tree-sitter-c"]
lang-cpp = ["dep:tree-sitter-cpp"]
lang-csharp = ["dep:tree-sitter-c-sharp"]
lang-ruby = ["dep:tree-sitter-ruby"]
lang-php = ["dep:tree-sitter-php"]
lang-lua = ["dep:tree-sitter-lua"]
lang-elixir = ["dep:tree-sitter-elixir"]
lang-swift = ["dep:tree-sitter-swift"]
lang-markdown = ["dep:tree-sitter-md"]
# Vendored in `vendor/tree-sitter-clarity` (not on crates.io), compiled by `build.rs`.
lang-clarity = ["dep:tree-sitter-language"]
candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:hf-hub"]
fastembed = ["dep:fastembed", "dep:ort"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 3

# dist builds release binaries with this profile.
[profile.dist]
inherits = "release"
